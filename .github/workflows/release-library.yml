name: release-library
on:
  workflow_dispatch:
    inputs:
      registry_type:
        description: "Registry type"
        required: false
        default: "all"
        type: choice
        options:
          - npm
          - github
          - all
      version_type:
        description: "Version bump"
        required: false
        default: "patch"
        type: choice
        options:
          - major
          - minor
          - patch
          - none
      explicit_version:
        description: "Explicit version, overrides version_type"
        required: false
        type: string
      package_manager:
        description: "Package manager"
        required: false
        default: "yarn"
        type: choice
        options:
          - npm
          - yarn
          - bun
          - pnpm
      build_folder:
        description: "Build output folder shipped in the package"
        required: false
        default: "build"
        type: string
      build_command:
        description: "Build command, defaults to build"
        required: false
        default: ""
        type: string
      check_command:
        description: "Check command, empty skips checks"
        required: false
        default: "check"
        type: string
      changelog_preset:
        description: "conventional-changelog preset, empty disables changelog"
        required: false
        default: "angular"
        type: string

jobs:
  release:
    uses: jenesei-software/.github/.github/workflows/release-library.yml@main
    with:
      version_type: ${{ inputs.version_type }}
      explicit_version: ${{ inputs.explicit_version }}
      package_manager: ${{ inputs.package_manager }}
      registry_type: ${{ inputs.registry_type }}
      build_folder: ${{ inputs.build_folder }}
      build_command: ${{ inputs.build_command }}
      check_command: ${{ inputs.check_command }}
      changelog_preset: ${{ inputs.changelog_preset }}
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_CYRILSTRONE_TOKEN }}
      ACCESS_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}